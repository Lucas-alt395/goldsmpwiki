<!DOCTYPE html>
<html lang="nl" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GoldSMP.nieuws - Generator</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;600&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        gold: {
                            400: '#fbbf24',
                            500: '#f59e0b',
                            600: '#d97706',
                        },
                        mc: {
                            bg: '#121212',
                            panel: '#1e1e1e',
                            border: '#333333',
                            accent: '#eab308'
                        }
                    },
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                        mono: ['Fira Code', 'monospace']
                    }
                }
            }
        }
    </script>
    <style>
        /* Custom scrollbar styling */
        ::-webkit-scrollbar {
            width: 8px;
            height: 8px;
        }
        ::-webkit-scrollbar-track {
            background: #18181b;
        }
        ::-webkit-scrollbar-thumb {
            background: #3f3f46;
            border-radius: 4px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #52525b;
        }
    </style>
</head>
<body class="bg-mc-bg text-gray-100 font-sans min-h-screen flex flex-col antialiased selection:bg-gold-500 selection:text-black">

    <!-- Header -->
    <header class="border-b border-mc-border bg-mc-panel/90 backdrop-blur sticky top-0 z-50">
        <div class="max-w-6xl mx-auto px-4 h-16 flex items-center justify-between">
            <div class="flex items-center space-x-3">
                <div class="w-10 h-10 rounded-lg bg-gradient-to-br from-gold-400 to-gold-600 flex items-center justify-center text-black font-extrabold text-xl shadow-lg shadow-gold-500/20">
                    <i class="fa-solid fa-newspaper"></i>
                </div>
                <div>
                    <h1 class="text-lg font-bold tracking-wide">
                        GoldSMP.nieuws
                    </h1>
                    <p class="text-xs text-gray-400">Berichten Generator</p>
                </div>
            </div>
            <div class="flex items-center space-x-2 text-sm text-gray-400">
                <span class="inline-flex items-center px-2.5 py-1 rounded-full text-xs font-medium bg-emerald-500/10 text-emerald-400 border border-emerald-500/20">
                    <span class="w-2 h-2 rounded-full bg-emerald-400 mr-1.5 animate-pulse"></span> Offline Ready
                </span>
            </div>
        </div>
    </header>

    <!-- Main Container -->
    <main class="flex-1 max-w-6xl w-full mx-auto p-4 md:p-6 grid grid-cols-1 lg:grid-cols-12 gap-6">

        <!-- Left Column: Form Controls (7 cols) -->
        <section class="lg:col-span-7 space-y-6">
            
            <!-- Message Settings Card -->
            <div class="bg-mc-panel border border-mc-border rounded-xl p-5 shadow-xl space-y-5">
                <h2 class="text-base font-semibold text-gray-200 border-b border-mc-border pb-3 flex items-center gap-2">
                    <i class="fa-solid fa-sliders text-gold-400"></i> Berichteigenschappen
                </h2>

                <!-- Category Picker with Auto-Complete & Add Custom -->
                <div class="relative">
                    <label class="block text-xs font-semibold uppercase tracking-wider text-gray-400 mb-2">
                        Categorieën Selecteren & Toevoegen
                    </label>

                    <!-- Selected Categories Badges -->
                    <div id="selected-categories" class="flex flex-wrap gap-2 mb-2 min-h-[32px] p-1.5 bg-zinc-900 border border-mc-border rounded-lg">
                        <span class="text-xs text-gray-500 italic px-2 py-1 select-none">Nog geen categorieën geselecteerd...</span>
                    </div>

                    <!-- Search & Input Box -->
                    <div class="relative">
                        <input type="text" id="category-search" placeholder="Zoek categorie (bijv. AD, Aardappelland, Lucasstad)..." 
                            class="w-full bg-zinc-900 border border-mc-border rounded-lg px-3.5 py-2.5 text-sm text-gray-100 focus:outline-none focus:border-gold-400 focus:ring-1 focus:ring-gold-400 transition-all font-sans"
                            autocomplete="off">
                        <i class="fa-solid fa-search absolute right-3.5 top-3 text-gray-500 text-sm"></i>
                    </div>

                    <!-- Auto-complete Dropdown -->
                    <div id="category-dropdown" class="hidden absolute left-0 right-0 top-full mt-1 bg-zinc-900 border border-mc-border rounded-lg shadow-2xl z-20 max-h-56 overflow-y-auto divide-y divide-zinc-800">
                        <!-- Items rendered via JavaScript -->
                    </div>
                </div>

                <!-- Title Input -->
                <div>
                    <label for="title-input" class="block text-xs font-semibold uppercase tracking-wider text-gray-400 mb-2">Titel van het Bericht</label>
                    <input type="text" id="title-input" placeholder="Bijv. Chunk te koop! / Nieuwe spoorlijn geopend" 
                        class="w-full bg-zinc-900 border border-mc-border rounded-lg px-3.5 py-2.5 text-sm text-gray-100 focus:outline-none focus:border-gold-400 focus:ring-1 focus:ring-gold-400 transition-all font-sans">
                </div>

                <!-- Message Body Input -->
                <div>
                    <label for="message-input" class="block text-xs font-semibold uppercase tracking-wider text-gray-400 mb-2">Bericht Inhoud</label>
                    <textarea id="message-input" rows="4" placeholder="Schrijf hier het volledige bericht..." 
                        class="w-full bg-zinc-900 border border-mc-border rounded-lg px-3.5 py-2.5 text-sm text-gray-100 focus:outline-none focus:border-gold-400 focus:ring-1 focus:ring-gold-400 transition-all font-sans resize-y"></textarea>
                </div>

            </div>

            <!-- Quick Actions & Reset -->
            <div class="flex items-center justify-between">
                <button type="button" onclick="resetForm()" class="text-xs text-gray-400 hover:text-red-400 transition-colors flex items-center gap-1.5 px-3 py-2 rounded-lg hover:bg-zinc-800">
                    <i class="fa-solid fa-rotate-left"></i> Formulier Wissen
                </button>
            </div>

        </section>

        <!-- Right Column: Live Showcase & Copy Options (5 cols) -->
        <section class="lg:col-span-5 space-y-6">
            
            <!-- Showcase Card -->
            <div class="bg-mc-panel border border-mc-border rounded-xl p-5 shadow-xl flex flex-col h-full justify-between">
                <div>
                    <div class="flex items-center justify-between border-b border-mc-border pb-3 mb-4">
                        <h2 class="text-base font-semibold text-gray-200 flex items-center gap-2">
                            <i class="fa-solid fa-eye text-gold-400"></i> Live Preview Showcase
                        </h2>
                        <span class="text-[10px] uppercase font-mono tracking-wider bg-zinc-800 text-gray-400 px-2 py-1 rounded">Format Output</span>
                    </div>

                    <!-- Display Box -->
                    <div class="relative group">
                        <div id="preview-output" class="w-full min-h-[220px] bg-black/80 border border-zinc-800 rounded-lg p-4 font-mono text-sm leading-relaxed text-gray-200 break-words whitespace-pre-wrap select-all shadow-inner">
                            <!-- Live text output injected here -->
                        </div>
                    </div>
                </div>

                <!-- Copy & Action Buttons -->
                <div class="mt-6 space-y-3">
                    <button type="button" id="copy-btn" onclick="copyToClipboard()" class="w-full py-3 px-4 bg-gradient-to-r from-gold-500 to-gold-600 hover:from-gold-400 hover:to-gold-500 text-black font-bold text-sm rounded-lg shadow-lg shadow-gold-500/20 transition-all flex items-center justify-center gap-2 active:scale-[0.99]">
                        <i class="fa-solid fa-copy"></i> Kopieer Bericht
                    </button>

                    <!-- Feedback Toast -->
                    <div id="toast" class="opacity-0 transition-opacity duration-300 text-center text-xs text-emerald-400 font-medium py-1">
                        <i class="fa-solid fa-check-circle mr-1"></i> Bericht gekopieerd naar klembord!
                    </div>
                </div>
            </div>

        </section>

    </main>

    <!-- Footer -->
    <footer class="border-t border-mc-border bg-mc-panel py-4 mt-auto text-center text-xs text-gray-500">
        GoldSMP.nieuws &copy; Official News Network Tooling
    </footer>

    <!-- Application Script -->
    <script>
        // Default Mock Categories (Simulating categories.json loading)
        const defaultCategories = [];

        // State Management
        let loadedCategories = [];
        let selectedCategories = []; // Array of objects: { name: string, isCustom: boolean }
        let previewMode = 'in-game'; // 'in-game' | 'discord'

        // Load Categories JSON
        async function initCategories() {
            try {
                // In production, try loading real categories.json if present
                const res = await fetch('./categories.json');
                if (res.ok) {
                    loadedCategories = await res.json();
                } else {
                    loadedCategories = defaultCategories;
                }
            } catch (e) {
                // Fallback to default list if JSON fetch fails
                loadedCategories = defaultCategories;
            }
            updatePreview();
        }

        // Category Auto-complete Search & Selection
        const searchInput = document.getElementById('category-search');
        const dropdown = document.getElementById('category-dropdown');

        searchInput.addEventListener('input', () => {
            const query = searchInput.value.trim().toLowerCase();
            if (!query) {
                dropdown.classList.add('hidden');
                return;
            }

            const matches = loadedCategories.filter(cat => 
                cat.toLowerCase().includes(query) && 
                !selectedCategories.some(s => s.name.toLowerCase() === cat.toLowerCase())
            );

            dropdown.innerHTML = '';

            // Render matching categories
            matches.forEach(cat => {
                const item = document.createElement('div');
                item.className = 'px-4 py-2.5 hover:bg-zinc-800 text-sm cursor-pointer flex items-center justify-between text-gray-200 transition-colors';
                item.innerHTML = `<span>[${cat}]</span> <span class="text-xs text-gray-500">Bestaand</span>`;
                item.onclick = () => addCategory(cat, false);
                dropdown.appendChild(item);
            });

            // Option to add a non-existing category
            const isExactMatch = loadedCategories.some(cat => cat.toLowerCase() === query);
            const isAlreadySelected = selectedCategories.some(s => s.name.toLowerCase() === query);

            if (!isExactMatch && !isAlreadySelected && query.length > 0) {
                const customItem = document.createElement('div');
                customItem.className = 'px-4 py-2.5 hover:bg-zinc-800 text-sm cursor-pointer flex items-center justify-between text-gold-400 transition-colors bg-gold-500/5';
                customItem.innerHTML = `<span>_[${searchInput.value.trim()}]¹_</span> <span class="text-xs text-gold-500 font-mono">+ Nieuwe Categorie</span>`;
                customItem.onclick = () => addCategory(searchInput.value.trim(), true);
                dropdown.appendChild(customItem);
            }

            dropdown.classList.remove('hidden');
        });

        // Close dropdown when clicking outside
        document.addEventListener('click', (e) => {
            if (!searchInput.contains(e.target) && !dropdown.contains(e.target)) {
                dropdown.classList.add('hidden');
            }
        });

        function addCategory(name, isCustom) {
            if (!selectedCategories.some(c => c.name.toLowerCase() === name.toLowerCase())) {
                selectedCategories.push({ name, isCustom });
                renderSelectedCategories();
                updatePreview();
            }
            searchInput.value = '';
            dropdown.classList.add('hidden');
        }

        function removeCategory(index) {
            selectedCategories.splice(index, 1);
            renderSelectedCategories();
            updatePreview();
        }

        function renderSelectedCategories() {
            const container = document.getElementById('selected-categories');
            if (selectedCategories.length === 0) {
                container.innerHTML = '<span class="text-xs text-gray-500 italic px-2 py-1 select-none">Nog geen categorieën geselecteerd...</span>';
                return;
            }

            container.innerHTML = '';
            selectedCategories.forEach((cat, index) => {
                const badge = document.createElement('span');
                badge.className = `inline-flex items-center gap-1.5 text-xs font-mono px-2.5 py-1 rounded-md border ${
                    cat.isCustom 
                        ? 'bg-amber-500/10 border-amber-500/30 text-amber-300' 
                        : 'bg-gold-500/10 border-gold-500/30 text-gold-400'
                }`;

                const label = cat.isCustom ? `_[${cat.name}]¹_` : `[${cat.name}]`;
                badge.innerHTML = `${label} <button type="button" onclick="removeCategory(${index})" class="hover:text-red-400 transition-colors ml-0.5"><i class="fa-solid fa-xmark"></i></button>`;
                container.appendChild(badge);
            });
        }

        // Dynamic Form Inputs
        document.getElementById('title-input').addEventListener('input', updatePreview);
        document.getElementById('message-input').addEventListener('input', updatePreview);

        // Generate Final Message String
        function generateMessage() {
            const title = document.getElementById('title-input').value.trim();
            const message = document.getElementById('message-input').value.trim();

            let parts = [];

            // 1. Categories
            let hasCustomCategory = false;
            if (selectedCategories.length > 0) {
                const catString = selectedCategories.map(c => {
                    if (c.isCustom) {
                        hasCustomCategory = true;
                        return `_[${c.name}]¹_`;
                    }
                    return `[${c.name}]`;
                }).join(' ');
                parts.push(catString);
            }

            // 2. Title
            if (title) {
                parts.push(title);
            }

            let mainContent = parts.join(' ');

            // Attach Body Message
            if (message) {
                mainContent += mainContent ? `\n\n${message}` : message;
            }

            // 3. Custom Category Footnote
            if (hasCustomCategory) {
                mainContent += `\n\n_¹ is een niet bestaande categorie._`;
            }

            return mainContent || "Begin met het invullen van het formulier...";
        }

        function updatePreview() {
            const outputBox = document.getElementById('preview-output');
            const text = generateMessage();
            outputBox.textContent = text;
        }

        // Clipboard Copy Action
        function copyToClipboard() {
            const textToCopy = generateMessage();
            
            // Execute fallback-safe clipboard copy
            const tempTextArea = document.createElement('textarea');
            tempTextArea.value = textToCopy;
            document.body.appendChild(tempTextArea);
            tempTextArea.select();
            document.execCommand('copy');
            document.body.removeChild(tempTextArea);

            // Toast UI animation
            const toast = document.getElementById('toast');
            toast.classList.remove('opacity-0');
            setTimeout(() => {
                toast.classList.add('opacity-0');
            }, 2500);
        }

        // Reset Form
        function resetForm() {
            selectedCategories = [];
            document.getElementById('title-input').value = '';
            document.getElementById('message-input').value = '';
            document.getElementById('category-search').value = '';
            renderSelectedCategories();
            updatePreview();
        }

        // Initialize on Load
        window.onload = () => {
            initCategories();
        };
    </script>
</body>
</html>
